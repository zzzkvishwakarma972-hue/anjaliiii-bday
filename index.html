<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anjali ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d6d,#7b2cbf,#000);
background-size:300% 300%;
animation:bg 8s infinite alternate;
overflow:hidden;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.box{
text-align:center;
color:white;
}

h1{
font-size:40px;
margin-bottom:20px;
}

button{
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff4d6d;
color:white;
font-size:20px;
cursor:pointer;
box-shadow:0 0 20px #ff4d6d;
}

button:hover{
transform:scale(1.05);
}
</style>

</head>
<body>

<div class="box">
<h1>🎂 Happy Birthday Anjali ❤️</h1>

<p style="margin-bottom:25px;">
A little surprise is waiting for you...✨
</p>

<button onclick="window.location.href='letter.html'">

</div>

</body>
</html>
